name: Release

# Runs when a version tag is pushed (`just release <version>` creates one). Builds `ch`
# for each target and publishes a GitHub release whose notes are that version's section
# of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails before anything is built if the tag and Cargo.toml disagree or there are no notes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the workspace version
        run: |
          version=$(awk -F '"' '/^\[/ { p = ($0 == "[workspace.package]") } p && /^version = / { print $2; exit }' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check CHANGELOG.md has notes for this version
        run: scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" | grep -qE '^[-*] '

  build:
    needs: check
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # The oldest runner, so the binary links against an older glibc and runs on
          # older distros (built on 24.04 it warns about GLIBC_2.39 on 22.04).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p ch-cli --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="ch-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/ch" README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ch-*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" >notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions like 0.2.0-rc.1 are marked as pre-releases.
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
